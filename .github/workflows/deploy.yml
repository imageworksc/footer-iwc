# Publishes the repository root to GitHub Pages on every push to main.
# The repo's Pages source is set to "GitHub Actions", so this workflow is
# what puts the site at https://imageworksc.github.io/footer-iwc/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp the commit into the stylesheet and script URLs so browsers
      # fetch the new files instead of reusing a cached build.
      - name: Bust asset cache
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
